# Build and deploy to VPS on push to main.
# Required GitHub Secrets: VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY
# Optional: VPS_REMOTE_DIR (default /var/www/configurator)

name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy imgs to dist
        run: cp -r imgs dist/ || true

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_REMOTE_DIR: ${{ secrets.VPS_REMOTE_DIR || '/var/www/configurator' }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_PRIVATE_KEY" ]; then
            echo "Missing secrets: set VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY in repo Settings → Secrets and variables → Actions"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" dist/ "$VPS_USER@$VPS_HOST:${VPS_REMOTE_DIR}/"
          echo "Deployed to $VPS_USER@$VPS_HOST:${VPS_REMOTE_DIR}/"
